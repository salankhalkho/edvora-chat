<div class="ops-dashboard-frame" style="width: 100% !important; max-width: 100% !important; min-width: 0 !important; box-sizing: border-box !important;">

  <!-- 1. Header (64px Height Specification) -->
  <div class="ops-dash-topbar" style="display: flex !important; flex-direction: row !important; align-items: center !important; justify-content: space-between !important; min-height: 64px !important; height: 64px !important; padding: 14px 20px !important; box-sizing: border-box !important; width: 100% !important; background: #FFFFFF !important; border-bottom: 1.5px solid #E6F0EC !important;">
    <div style="display: flex !important; align-items: center !important; gap: 14px !important;">
      <button onclick="switchNavTab('knowledge')" class="brand-btn-secondary" style="height: 34px; padding: 0 12px; font-size: 11.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; border-radius: 8px; background: #F4FAF7; border: 1.5px solid #D1E5DE; color: var(--e-teal, #063D3B);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span>Back to Knowledge Hub</span>
      </button>
      <div style="width: 1px; height: 24px; background: #E6F0EC;"></div>
      <div>
        <div class="ops-dash-main-title" style="font-size: 15px !important; font-weight: 800 !important; color: var(--e-teal, #063D3B) !important;">Add / Ingest Knowledge Source</div>
        <div class="ops-dash-sub-title" style="font-size: 11px !important; color: #648781 !important; font-weight: 500 !important; margin-top: 2px !important;">Upload PDFs, crawl public university web pages, or store direct admission circulars</div>
      </div>
    </div>

    <div class="ops-dash-controls" style="display: flex !important; align-items: center !important; gap: 10px !important;">
      <div class="ckh-ctrl-pill" style="font-size: 11px !important; font-weight: 700 !important; color: var(--e-teal) !important; background: #F4FAF7 !important; border: 1px solid #D1E5DE !important; border-radius: 8px !important; padding: 5px 11px !important; display: inline-flex !important; align-items: center !important; gap: 5px !important;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        <span>Academic Cycle: 2026&ndash;2027 Active</span>
      </div>
    </div>
  </div>

  <!-- 2. Ingestion Workspace Main Card -->
  <div style="padding: 24px; background: #FAFDFB;">
    <div style="max-width: 960px; margin: 0 auto; background: #FFFFFF; border: 1.5px solid #DCE9E5; border-radius: 16px; box-shadow: 0 12px 36px -8px rgba(6, 61, 59, 0.06); overflow: hidden;">
      
      <!-- Ingestion Method Tabs -->
      <div style="display: flex; gap: 10px; padding: 18px 24px; border-bottom: 1.5px solid #E6F0EC; background: #F8FBFA;">
        <button type="button" id="tabBtnUpload" onclick="switchIngestMode('upload')" class="brand-btn-secondary" style="padding: 8px 16px; font-size: 12px; font-weight: 700; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; background: #063D3B; color: #C8FF63; border: 1px solid #063D3B;">
          <span>📄 Document Upload</span>
        </button>
        <button type="button" id="tabBtnUrl" onclick="switchIngestMode('url')" class="brand-btn-secondary" style="padding: 8px 16px; font-size: 12px; font-weight: 600; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; background: #FFFFFF; color: #648781; border: 1px solid #D1E5DE;">
          <span>🌐 Web URL Crawler</span>
        </button>
        <button type="button" id="tabBtnText" onclick="switchIngestMode('text')" class="brand-btn-secondary" style="padding: 8px 16px; font-size: 12px; font-weight: 600; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; background: #FFFFFF; color: #648781; border: 1px solid #D1E5DE;">
          <span>📝 Direct Text / Circular</span>
        </button>
      </div>

      <div style="padding: 24px;">

        <!-- MODE 1: DOCUMENT FILE UPLOAD -->
        <form id="ingestFormFile" onsubmit="submitIngestFile(event)" style="display: block;">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
            <div>
              <label style="display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #648781; margin-bottom: 6px;">Document Title</label>
              <input type="text" id="ingestDocTitle" placeholder="e.g. MBA Admissions Prospectus 2026&ndash;27" required style="width: 100%; height: 38px; padding: 0 12px; border: 1.5px solid #D1E5DE; border-radius: 8px; font-size: 12.5px; box-sizing: border-box;">
            </div>
            <div>
              <label style="display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #648781; margin-bottom: 6px;">Category</label>
              <select id="ingestDocCategory" onchange="toggleCustomCategoryInput('ingestDocCategory', 'ingestDocCategoryCustomWrap', 'ingestDocCategoryCustom')" style="width: 100%; height: 38px; padding: 0 12px; border: 1.5px solid #D1E5DE; border-radius: 8px; font-size: 12.5px; box-sizing: border-box; background: #FFFFFF;">
                <option value="General / Institutional">General / Institutional</option>
                <option value="Admissions & Prospectus">Admissions &amp; Prospectus</option>
                <option value="Tuition & Fee Structure">Tuition &amp; Fee Structure</option>
                <option value="Scholarships & Financial Aid">Scholarships &amp; Financial Aid</option>
                <option value="Eligibility & Criteria">Eligibility &amp; Criteria</option>
                <option value="Academic Curriculum & Programs">Academic Curriculum &amp; Programs</option>
                <option value="Hostel & Campus Life">Hostel &amp; Campus Life</option>
                <option value="Placements & Career Outcomes">Placements &amp; Career Outcomes</option>
                <option value="Examinations & Policies">Examinations &amp; Policies</option>
                <option value="__custom__">➕ Other (Specify Custom Category...)</option>
              </select>
              <div id="ingestDocCategoryCustomWrap" style="display: none; margin-top: 8px;">
                <input type="text" id="ingestDocCategoryCustom" placeholder="Enter custom category name (e.g. Sports & Athletics)" style="width: 100%; height: 38px; padding: 0 12px; border: 1.5px solid #063D3B; border-radius: 8px; font-size: 12.5px; box-sizing: border-box; background: #F8FBFA; color: #063D3B; font-weight: 600;">
              </div>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 20px;">
            <div>
              <label style="display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #648781; margin-bottom: 6px;">Academic Version</label>
              <input type="text" id="ingestAcademicVersion" value="2026&ndash;27" style="width: 100%; height: 38px; padding: 0 12px; border: 1.5px solid #D1E5DE; border-radius: 8px; font-size: 12.5px; box-sizing: border-box;">
            </div>
            <div>
              <label style="display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #648781; margin-bottom: 6px;">Validity Period</label>
              <select id="ingestValidityPeriod" style="width: 100%; height: 38px; padding: 0 12px; border: 1.5px solid #D1E5DE; border-radius: 8px; font-size: 12.5px; box-sizing: border-box; background: #FFFFFF;">
                <option value="365">365 Days (Full Academic Year)</option>
                <option value="180">180 Days (Semester Cycle)</option>
                <option value="90">90 Days (Admissions Window)</option>
                <option value="30">30 Days (Urgent / Circular)</option>
              </select>
            </div>
            <div>
              <label style="display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #648781; margin-bottom: 6px;">Department Scope</label>
              <select id="ingestDeptScope" style="width: 100%; height: 38px; padding: 0 12px; border: 1.5px solid #D1E5DE; border-radius: 8px; font-size: 12.5px; box-sizing: border-box; background: #FFFFFF;">
                <option value="">Institution-Wide (All Units)</option>
              </select>
            </div>
          </div>

          <!-- Drag and Drop Zone -->
          <div id="dropZoneFile" style="border: 2px dashed #B8DCD0; border-radius: 12px; background: #F8FBFA; padding: 36px 20px; text-align: center; cursor: pointer; transition: all 0.2s ease; margin-bottom: 24px;" onclick="document.getElementById('ingestFileInput').click()">
            <input type="file" id="ingestFileInput" accept=".pdf,.docx,.txt" style="display: none;" onchange="handleFileSelected(this)">
            <div style="font-size: 32px; margin-bottom: 8px;">📁</div>
            <div id="dropZonePromptText" style="font-size: 13.5px; font-weight: 700; color: var(--e-teal, #063D3B); margin-bottom: 4px;">Click or Drag PDF, DOCX, or TXT file here</div>
            <div style="font-size: 11.5px; color: #648781;">Supports up to 25 MB documents &bull; Auto-indexed into fulltext engine with OCR support</div>
          </div>

          <div style="display: flex; justify-content: flex-end; align-items: center; gap: 12px;">
            <button type="button" onclick="switchNavTab('knowledge')" class="brand-btn-secondary" style="height: 38px; padding: 0 18px; font-size: 12px; font-weight: 600; border-radius: 8px; border: 1.5px solid #D1E5DE; background: #FFFFFF; color: #648781; cursor: pointer;">Cancel</button>
            <button type="submit" id="btnSubmitFile" class="brand-btn-primary" style="height: 38px; padding: 0 22px; font-size: 12px; font-weight: 700; border-radius: 8px; background: #063D3B; color: #C8FF63; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;">
              <span>Upload &amp; Index Document</span>
            </button>
          </div>
        </form>

        <!-- MODE 2: WEB URL CRAWLER -->
        <form id="ingestFormUrl" onsubmit="submitIngestUrl(event)" style="display: none;">
          <div style="margin-bottom: 16px;">
            <label style="display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #648781; margin-bottom: 6px;">Target Public Web URL</label>
            <input type="url" id="ingestTargetUrl" placeholder="https://college.edu/admissions/eligibility" required style="width: 100%; height: 38px; padding: 0 12px; border: 1.5px solid #D1E5DE; border-radius: 8px; font-size: 12.5px; box-sizing: border-box;">
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
            <div>
              <label style="display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #648781; margin-bottom: 6px;">Resource Title</label>
              <input type="text" id="ingestUrlTitle" placeholder="e.g. Undergraduate Admissions Portal" required style="width: 100%; height: 38px; padding: 0 12px; border: 1.5px solid #D1E5DE; border-radius: 8px; font-size: 12.5px; box-sizing: border-box;">
            </div>
            <div>
              <label style="display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #648781; margin-bottom: 6px;">Category</label>
              <select id="ingestUrlCategory" onchange="toggleCustomCategoryInput('ingestUrlCategory', 'ingestUrlCategoryCustomWrap', 'ingestUrlCategoryCustom')" style="width: 100%; height: 38px; padding: 0 12px; border: 1.5px solid #D1E5DE; border-radius: 8px; font-size: 12.5px; box-sizing: border-box; background: #FFFFFF;">
                <option value="General / Institutional">General / Institutional</option>
                <option value="Admissions & Prospectus">Admissions &amp; Prospectus</option>
                <option value="Tuition & Fee Structure">Tuition &amp; Fee Structure</option>
                <option value="Scholarships & Financial Aid">Scholarships &amp; Financial Aid</option>
                <option value="Eligibility & Criteria">Eligibility &amp; Criteria</option>
                <option value="Academic Curriculum & Programs">Academic Curriculum &amp; Programs</option>
                <option value="Hostel & Campus Life">Hostel &amp; Campus Life</option>
                <option value="Placements & Career Outcomes">Placements &amp; Career Outcomes</option>
                <option value="Examinations & Policies">Examinations &amp; Policies</option>
                <option value="__custom__">➕ Other (Specify Custom Category...)</option>
              </select>
              <div id="ingestUrlCategoryCustomWrap" style="display: none; margin-top: 8px;">
                <input type="text" id="ingestUrlCategoryCustom" placeholder="Enter custom category name (e.g. Sports & Athletics)" style="width: 100%; height: 38px; padding: 0 12px; border: 1.5px solid #063D3B; border-radius: 8px; font-size: 12.5px; box-sizing: border-box; background: #F8FBFA; color: #063D3B; font-weight: 600;">
              </div>
            </div>
          </div>
          <div style="display: flex; justify-content: flex-end; align-items: center; gap: 12px; margin-top: 24px;">
            <button type="button" onclick="switchNavTab('knowledge')" class="brand-btn-secondary" style="height: 38px; padding: 0 18px; font-size: 12px; font-weight: 600; border-radius: 8px; border: 1.5px solid #D1E5DE; background: #FFFFFF; color: #648781; cursor: pointer;">Cancel</button>
            <button type="submit" id="btnSubmitUrl" class="brand-btn-primary" style="height: 38px; padding: 0 22px; font-size: 12px; font-weight: 700; border-radius: 8px; background: #063D3B; color: #C8FF63; border: none; cursor: pointer;">Crawl &amp; Index URL</button>
          </div>
        </form>

        <!-- MODE 3: DIRECT TEXT / CIRCULAR -->
        <form id="ingestFormText" onsubmit="submitIngestText(event)" style="display: none;">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
            <div>
              <label style="display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #648781; margin-bottom: 6px;">Notice / Circular Title</label>
              <input type="text" id="ingestTextTitle" placeholder="e.g. Special Round Counseling Dates Circular" required style="width: 100%; height: 38px; padding: 0 12px; border: 1.5px solid #D1E5DE; border-radius: 8px; font-size: 12.5px; box-sizing: border-box;">
            </div>
            <div>
              <label style="display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #648781; margin-bottom: 6px;">Category</label>
              <select id="ingestTextCategory" onchange="toggleCustomCategoryInput('ingestTextCategory', 'ingestTextCategoryCustomWrap', 'ingestTextCategoryCustom')" style="width: 100%; height: 38px; padding: 0 12px; border: 1.5px solid #D1E5DE; border-radius: 8px; font-size: 12.5px; box-sizing: border-box; background: #FFFFFF;">
                <option value="General / Institutional">General / Institutional</option>
                <option value="Admissions & Prospectus">Admissions &amp; Prospectus</option>
                <option value="Tuition & Fee Structure">Tuition &amp; Fee Structure</option>
                <option value="Scholarships & Financial Aid">Scholarships &amp; Financial Aid</option>
                <option value="Eligibility & Criteria">Eligibility &amp; Criteria</option>
                <option value="Academic Curriculum & Programs">Academic Curriculum &amp; Programs</option>
                <option value="Hostel & Campus Life">Hostel &amp; Campus Life</option>
                <option value="Placements & Career Outcomes">Placements &amp; Career Outcomes</option>
                <option value="Examinations & Policies">Examinations &amp; Policies</option>
                <option value="__custom__">➕ Other (Specify Custom Category...)</option>
              </select>
              <div id="ingestTextCategoryCustomWrap" style="display: none; margin-top: 8px;">
                <input type="text" id="ingestTextCategoryCustom" placeholder="Enter custom category name (e.g. Sports & Athletics)" style="width: 100%; height: 38px; padding: 0 12px; border: 1.5px solid #063D3B; border-radius: 8px; font-size: 12.5px; box-sizing: border-box; background: #F8FBFA; color: #063D3B; font-weight: 600;">
              </div>
            </div>
          </div>
          <div style="margin-bottom: 20px;">
            <label style="display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #648781; margin-bottom: 6px;">Circular Body / Knowledge Content</label>
            <textarea id="ingestTextContent" rows="8" placeholder="Paste fulltext knowledge notice, deadlines, fee waiver criteria, or policy circular here..." required style="width: 100%; padding: 12px; border: 1.5px solid #D1E5DE; border-radius: 8px; font-size: 12.5px; font-family: inherit; box-sizing: border-box; resize: vertical;"></textarea>
          </div>
          <div style="display: flex; justify-content: flex-end; align-items: center; gap: 12px;">
            <button type="button" onclick="switchNavTab('knowledge')" class="brand-btn-secondary" style="height: 38px; padding: 0 18px; font-size: 12px; font-weight: 600; border-radius: 8px; border: 1.5px solid #D1E5DE; background: #FFFFFF; color: #648781; cursor: pointer;">Cancel</button>
            <button type="submit" id="btnSubmitText" class="brand-btn-primary" style="height: 38px; padding: 0 22px; font-size: 12px; font-weight: 700; border-radius: 8px; background: #063D3B; color: #C8FF63; border: none; cursor: pointer;">Save &amp; Index Text</button>
          </div>
        </form>

      </div>
    </div>
  </div>

</div>
