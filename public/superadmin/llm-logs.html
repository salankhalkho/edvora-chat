<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Prompt &amp; Conversation Inspector — edvora.chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/theme-branding.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 12px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #topHeader {
            height: 48px;
            background: #111827;
            border-bottom: 1px solid #1f2937;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-title {
            font-size: 13.5px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-primary { background: rgba(99, 102, 241, 0.2); color: #a5b4fc; border: 1px solid rgba(99, 102, 241, 0.4); }
        .badge-success { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.4); }
        .badge-inactive { background: rgba(156, 163, 175, 0.2); color: #9ca3af; border: 1px solid rgba(156, 163, 175, 0.4); }
        .badge-fallback { background: rgba(245, 158, 11, 0.2); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.4); }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn {
            height: 30px;
            padding: 0 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border-radius: 6px;
            font-size: 11.5px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            text-decoration: none;
            transition: all 0.15s ease;
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border-color: #1f2937;
        }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.14); }
        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border-color: rgba(239, 68, 68, 0.35);
        }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.25); }

        #contentWrapper {
            flex: 1;
            padding: 24px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .desc-banner {
            font-size: 11.5px;
            color: #9ca3af;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .log-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
            transition: border-color 0.2s ease;
        }
        .log-card.latest {
            border-color: rgba(99, 102, 241, 0.6);
            background: #121a2d;
        }
        .log-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .section-block {
            margin-bottom: 16px;
        }
        .section-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .label-user { color: #38bdf8; }
        .label-history { color: #a78bfa; }
        .label-system { color: #f59e0b; }
        .label-response { color: #34d399; }

        .content-box {
            border-radius: 6px;
            padding: 12px 14px;
            font-size: 12px;
            line-height: 1.6;
        }
        .content-user {
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.25);
            color: #fff;
            font-weight: 600;
        }
        .content-history {
            background: #080c14;
            border: 1px solid #1f2937;
        }
        .content-pre {
            margin: 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11.5px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .content-system {
            background: #070a12;
            border: 1px solid #1f2937;
            color: #cbd5e1;
        }
        .content-response {
            background: rgba(16, 185, 129, 0.06);
            border: 1px solid rgba(16, 185, 129, 0.25);
            color: #a7f3d0;
        }

        #toast {
            position: fixed;
            top: 16px;
            right: 16px;
            background: #1e293b;
            border: 1px solid #334155;
            color: #fff;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 11.5px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: none;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <header id="topHeader">
        <div class="header-title">
            <span>🔬</span>
            <span>LLM Prompt &amp; Conversation Inspector</span>
            <span id="logCountBadge" class="badge badge-primary">0 / 7 Records</span>
            <span id="autoPollBadge" class="badge badge-success" style="cursor: pointer;" onclick="toggleAutoPoll()">● Live Polling Active (3s)</span>
        </div>
        <div class="header-actions">
            <button onclick="fetchLogs(true)" class="btn btn-secondary" id="btnRefresh">
                🔄 Refresh Now
            </button>
            <button onclick="clearLogs()" class="btn btn-danger" title="Clear recorded logs">
                🗑️ Clear
            </button>
            <a href="/superadmin/" class="btn btn-secondary" style="color: #9ca3af;">
                ← Back to Super Admin
            </a>
        </div>
    </header>

    <main id="contentWrapper">
        <div class="desc-banner">
            <div>
                Displaying the past <strong>7 or fewer</strong> prompts sent to the LLM during chatbot usage. Live auto-refreshes every 3 seconds.
            </div>
            <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px;">
                Server: <span id="serverTimeText" style="color: #fff;">Connecting...</span>
            </div>
        </div>

        <div id="logsList">
            <div style="text-align: center; color: #9ca3af; padding: 60px;">
                Connecting to LLM logs...
            </div>
        </div>
    </main>

    <div id="toast"></div>

    <script>
        let autoPollActive = true;
        let pollTimer = null;
        let lastRenderHash = '';

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2200);
        }

        function toggleAutoPoll() {
            autoPollActive = !autoPollActive;
            const badge = document.getElementById('autoPollBadge');
            if (autoPollActive) {
                badge.className = 'badge badge-success';
                badge.innerHTML = '● Live Polling Active (3s)';
                startPolling();
            } else {
                badge.className = 'badge badge-inactive';
                badge.innerHTML = '○ Polling Paused';
                stopPolling();
            }
        }

        function startPolling() {
            if (pollTimer) clearInterval(pollTimer);
            pollTimer = setInterval(() => {
                if (autoPollActive) fetchLogs(false);
            }, 3000);
        }

        function stopPolling() {
            if (pollTimer) {
                clearInterval(pollTimer);
                pollTimer = null;
            }
        }

        async function fetchLogs(manual = false) {
            const btn = document.getElementById('btnRefresh');
            if (manual && btn) {
                btn.disabled = true;
                btn.innerText = 'Refreshing...';
            }

            try {
                const res = await fetch('/v1/public/llm-debug-logs');
                const json = await res.json();
                
                if (json && json.status === 'success') {
                    const logs = json.data.logs || [];
                    document.getElementById('serverTimeText').innerText = json.data.server_time || new Date().toLocaleTimeString();
                    document.getElementById('logCountBadge').innerText = `${logs.length} / 7 Records`;

                    const currentHash = JSON.stringify(logs.map(l => l.id || l.timestamp));
                    if (currentHash !== lastRenderHash || manual) {
                        lastRenderHash = currentHash;
                        renderLogs(logs);
                    }

                    if (manual) showToast(`Loaded ${logs.length} LLM interaction(s).`);
                }
            } catch (err) {
                console.error('Failed to fetch LLM logs:', err);
                if (manual) showToast('Failed to load logs: ' + err.message);
            } finally {
                if (manual && btn) {
                    btn.disabled = false;
                    btn.innerText = '🔄 Refresh Now';
                }
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function renderLogs(logs) {
            const list = document.getElementById('logsList');
            if (!logs || logs.length === 0) {
                list.innerHTML = `
                    <div style="text-align: center; padding: 60px 24px; background: rgba(255,255,255,0.02); border: 1px dashed #1f2937; border-radius: 8px;">
                        <div style="font-size: 30px; margin-bottom: 8px;">📭</div>
                        <div style="font-size: 13.5px; font-weight: 600; color: #fff; margin-bottom: 4px;">No LLM prompts recorded yet</div>
                        <div style="font-size: 11.5px; color: #9ca3af;">
                            Open <a href="/test_chat.html?token=22cc0a443b4bec08b5337f914726c40c" target="_blank" style="color: #818cf8; text-decoration: underline;">test_chat.html</a> in another tab, send a message, and it will appear here automatically within 3 seconds.
                        </div>
                    </div>
                `;
                return;
            }

            list.innerHTML = logs.map((item, idx) => {
                const isLatest = idx === 0;
                const num = idx + 1;
                const latestBadge = isLatest 
                    ? `<span class="badge badge-success">● Latest (#${num})</span>` 
                    : `<span class="badge badge-inactive">#${num} of ${logs.length}</span>`;
                const modelBadge = item.model ? `<span class="badge badge-primary">${escapeHtml(item.model)}</span>` : '';
                const tokensBadge = item.tokens_used ? `<span class="badge badge-fallback">${item.tokens_used} tokens</span>` : '';

                let historyHtml = '<div style="color: #6b7280; font-style: italic;">No prior conversation history in this turn (Turn 1).</div>';
                if (Array.isArray(item.conversation_history) && item.conversation_history.length > 0) {
                    historyHtml = item.conversation_history.map(h => {
                        const isUser = h.role === 'user';
                        const roleColor = isUser ? '#38bdf8' : '#a78bfa';
                        const roleLabel = isUser ? 'Visitor' : 'Chatbot';
                        return `
                            <div style="margin-bottom: 6px; padding: 6px 10px; background: rgba(0,0,0,0.3); border-left: 3px solid ${roleColor}; border-radius: 4px;">
                                <span style="color: ${roleColor}; font-weight: 700; font-size: 10px; text-transform: uppercase;">${roleLabel}:</span>
                                <span style="color: #e2e8f0; font-size: 11.5px; margin-left: 6px;">${escapeHtml(h.content)}</span>
                            </div>
                        `;
                    }).join('');
                }

                return `
                    <div class="log-card ${isLatest ? 'latest' : ''}">
                        <div class="log-header">
                            <div style="display: flex; align-items: center; gap: 8px;">
                                ${latestBadge}
                                <span style="color: #fff; font-weight: 700; font-family: 'JetBrains Mono', monospace; font-size: 12.5px;">
                                    ⏱️ ${escapeHtml(item.timestamp)}
                                </span>
                                ${modelBadge}
                                ${tokensBadge}
                            </div>
                            <div style="font-size: 11px; color: #6b7280; font-family: 'JetBrains Mono', monospace;">
                                ID: ${escapeHtml(item.id || 'N/A')}
                            </div>
                        </div>

                        <div class="section-block">
                            <div class="section-label label-user">
                                <span>💬 User Prompt (Visitor Query)</span>
                            </div>
                            <div class="content-box content-user">
                                ${escapeHtml(item.user_prompt)}
                            </div>
                        </div>

                        <div class="section-block">
                            <div class="section-label label-history">
                                <span>📜 Conversation History Snippet (Previous Turns Sent to LLM)</span>
                            </div>
                            <div class="content-box content-history">
                                ${historyHtml}
                            </div>
                        </div>

                        <div class="section-block">
                            <div class="section-label label-system">
                                <span>⚙️ Full System Prompt (Instructions, Knowledge Context &amp; Guardrails)</span>
                                <span style="font-size: 10px; color: #6b7280; font-weight: 400;">(${item.system_prompt ? item.system_prompt.length.toLocaleString() : 0} chars)</span>
                            </div>
                            <div class="content-box content-system">
                                <pre class="content-pre">${escapeHtml(item.system_prompt)}</pre>
                            </div>
                        </div>

                        <div class="section-block" style="margin-bottom: 0;">
                            <div class="section-label label-response">
                                <span>🤖 LLM Response Generated</span>
                            </div>
                            <div class="content-box content-response">
                                <pre class="content-pre">${escapeHtml(item.llm_response)}</pre>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function clearLogs() {
            if (!confirm('Clear all 7 recent LLM debug log entries?')) return;
            try {
                const res = await fetch('/v1/superadmin/llm-debug-logs', { method: 'DELETE' });
                showToast('Cleared logs.');
                lastRenderHash = '';
                fetchLogs(true);
            } catch (err) {
                showToast('Clear failed: ' + err.message);
            }
        }

        fetchLogs(true);
        startPolling();
    </script>
</body>
</html>
